<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>지뢰체스 · MineChess — 새 주소로 이동합니다</title>

    <!--
      옛 주소를 받은 사람들을 위한 안내판.

      게임은 Cloudflare 로 옮겼다. 서버가 있어야 온라인 대국이 되고,
      GitHub Pages 는 파일만 나눠 주는 곳이라 서버를 둘 수 없기 때문이다.

      링크를 이미 받은 사람이 있으므로 이 주소를 없애지 않고 넘겨준다.
      자동 이동이 막힌 환경(스크립트 차단 등)에서도 눌러서 갈 수 있게
      링크를 함께 둔다.
    -->
    <meta http-equiv="refresh" content="0; url=https://minechess.minechess.workers.dev/" />
    <link rel="canonical" href="https://minechess.minechess.workers.dev/" />

    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #14161b;
        color: #e6e3dc;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Malgun Gothic',
          sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: #9aa0aa;
        font-size: 14px;
        line-height: 1.7;
      }
      a.go {
        margin-top: 6px;
        padding: 12px 22px;
        border-radius: 9px;
        background: #e8b44a;
        color: #201703;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>지뢰체스</h1>
    <p>주소가 바뀌었습니다. 잠시 후 자동으로 이동합니다.</p>
    <a class="go" href="https://minechess.minechess.workers.dev/">지금 이동하기</a>
    <p>minechess.minechess.workers.dev</p>
  </body>
</html>
